<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>కేరళ భగవతి జ్యోతిష్యం</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#050505;
    font-family:"Noto Sans Telugu",sans-serif;
}


/* MAIN MOBILE POSTER */

.poster{

    width:100%;
    max-width:480px;
    height:100dvh;

    margin:auto;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,170,0,.16),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #080604,
            #120702 55%,
            #030303
        );

}


/* TOP GOLD GLOW */

.poster::before{

    content:"";

    position:absolute;

    width:330px;
    height:330px;

    top:-130px;
    left:50%;

    transform:translateX(-50%);

    background:#ff9d00;

    filter:blur(130px);

    opacity:.15;

}


/* CONTENT */

.content{

    position:relative;
    z-index:2;

    width:100%;
    height:100%;

    padding:
        3vh
        22px
        2vh;

    display:flex;
    flex-direction:column;

}


/* =========================
   TOP IMAGE
========================= */

.image-box{

    width:
        clamp(100px,22vw,125px);

    height:
        clamp(100px,22vw,125px);

    margin:0 auto;

    padding:4px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #fff4ae,
            #ffb000,
            #8e4200,
            #fff1a0
        );

    box-shadow:
        0 0 30px
        rgba(255,174,0,.35);

}

.image-box img{

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    border:3px solid #100704;

}


/* =========================
   HEADING
========================= */

.label{

    margin-top:1.2vh;

    text-align:center;

    color:#e4b548;

    font-size:
        clamp(9px,2.5vw,12px);

    letter-spacing:2px;

}

h1{

    margin-top:.3vh;

    text-align:center;

    font-size:
        clamp(27px,7.5vw,40px);

    line-height:1.2;

    font-weight:800;

    background:
        linear-gradient(
            180deg,
            #fff4a3,
            #ffc21c,
            #e98600
        );

    -webkit-background-clip:text;

    color:transparent;

}


.subtitle{

    text-align:center;

    margin-top:.7vh;

    color:#d7c7af;

    font-size:
        clamp(10px,2.8vw,14px);

}


/* GOLD DIVIDER */

.divider{

    display:flex;

    align-items:center;

    gap:9px;

    margin:
        1.7vh
        0;

}

.divider span{

    height:1px;
    flex:1;

    background:
        linear-gradient(
            90deg,
            transparent,
            #bd8615
        );

}

.divider span:last-child{

    background:
        linear-gradient(
            90deg,
            #bd8615,
            transparent
        );

}

.divider b{

    color:#ffc928;
    font-size:14px;

}


/* =========================
   POINTS
========================= */

.points{

    flex:1;

    display:flex;

    flex-direction:column;

    justify-content:center;

    gap:
        clamp(8px,1.6vh,14px);

}


/* EACH POINT */

.point{

    display:flex;

    align-items:center;

    min-height:
        clamp(47px,7.5vh,60px);

    padding:
        5px 12px 5px 6px;

    border-radius:50px;

    background:
        linear-gradient(
            90deg,
            rgba(255,164,0,.13),
            rgba(255,255,255,.035),
            transparent
        );

    border-left:
        2px solid #d99b20;

}


/* NUMBER */

.number{

    width:
        clamp(36px,9vw,48px);

    height:
        clamp(36px,9vw,48px);

    flex-shrink:0;

    margin-right:12px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#211000;

    font-size:
        clamp(15px,4vw,19px);

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #fff3a0,
            #ffc21a,
            #d87600
        );

    box-shadow:
        0 0 15px
        rgba(255,176,0,.22);

}


/* TEXT */

.point-text{

    color:#fff;

    font-size:
        clamp(13px,3.7vw,17px);

    line-height:1.35;

    font-weight:600;

}

.point-text strong{

    color:#ffd34a;

}


/* =========================
   BOTTOM MESSAGE
========================= */

.bottom{

    flex-shrink:0;

    text-align:center;

}


.message{

    color:#e9dfd0;

    font-size:
        clamp(11px,3.2vw,15px);

    line-height:1.6;

    margin-bottom:1.2vh;

}

.message span{

    color:#ffd047;
    font-weight:800;

}


/* =========================
   CTA
========================= */

.cta{

    width:100%;

    height:
        clamp(52px,8vh,64px);

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    border-radius:16px;

    text-decoration:none;

    color:#071707;

    font-size:
        clamp(15px,4.5vw,19px);

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #cfff94,
            #20d94c,
            #05a737
        );

    border:
        2px solid #efffdc;

    box-shadow:
        0 0 25px
        rgba(29,226,65,.28);

}


/* WHATSAPP ICON */

.whatsapp{

    width:34px;
    height:34px;

    border-radius:50%;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;

}


/* FOOTER */

.footer{

    margin-top:.7vh;

    color:#766b5c;

    font-size:8px;

    text-align:center;

}


/* SMALL HEIGHT MOBILE */

@media(max-height:650px){

    .content{
        padding-top:1.5vh;
    }

    .image-box{
        width:70px;
        height:70px;
    }

    .label{
        display:none;
    }

    h1{
        font-size:26px;
    }

    .subtitle{
        display:none;
    }

    .divider{
        margin:1vh 0;
    }

    .points{
        gap:6px;
    }

    .point{
        min-height:42px;
    }

    .number{
        width:34px;
        height:34px;
    }

    .message{
        margin-bottom:5px;
    }

    .cta{
        height:48px;
    }

}

</style>
</head>


<body>

<div class="poster">

<div class="content">


    <!-- GODDESS -->

    <div class="image-box">

        <img
            src="https://i.pinimg.com/1200x/8e/fe/34/8efe343a4095693c154f437f97a21719.jpg"
            alt="కేరళ భగవతి"
        >

    </div>


    <!-- TITLE -->

    <div class="label">
        ✦ దైవ అనుగ్రహంతో ✦
    </div>

    <h1>
        కేరళ భగవతి జ్యోతిష్యం
    </h1>

    <div class="subtitle">
        మీ సమస్యలకు సరైన మార్గదర్శనం
    </div>


    <!-- DIVIDER -->

    <div class="divider">

        <span></span>

        <b>✦</b>

        <span></span>

    </div>


    <!-- POINTS -->

    <div class="points">


        <div class="point">

            <div class="number">01</div>

            <div class="point-text">
                నెంబర్ 1 <strong>వశీకరణ స్పెషలిస్ట్</strong>
            </div>

        </div>


        <div class="point">

            <div class="number">02</div>

            <div class="point-text">
                ప్రేమ వ్యవహారాల్లో <strong>సమస్యలు</strong>
            </div>

        </div>


        <div class="point">

            <div class="number">03</div>

            <div class="point-text">
                <strong>సంతాన</strong> సమస్యలు
            </div>

        </div>


        <div class="point">

            <div class="number">04</div>

            <div class="point-text">
                <strong>ఆర్థిక</strong> ఇబ్బందులు
            </div>

        </div>


        <div class="point">

            <div class="number">05</div>

            <div class="point-text">
                ఇంట్లో <strong>అశాంతి</strong>
            </div>

        </div>


    </div>


    <!-- BOTTOM -->

    <div class="bottom">

        <div class="message">
            మీకు ఎలాంటి సమస్య ఉన్నా
            <span>మమ్మల్ని సంప్రదించండి...</span>
        </div>


        <a
            class="cta"
            href="https://wa.me/918431468492"
            target="_blank"
        >

            <span class="whatsapp">☏</span>

            <span>
                మమ్మల్ని సంప్రదించండి
            </span>

            <span>→</span>

        </a>


        <div class="footer">
            ✦ మీ విశ్వాసమే మా బాధ్యత ✦
        </div>

    </div>


</div>

</div>

</body>
</html>
